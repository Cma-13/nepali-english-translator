<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Translator{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; }
        nav { background: #1e3a5f; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a, nav button { color: white; text-decoration: none; margin-left: 14px; background: none; border: none; cursor: pointer; font-size: 15px; }
        .container { max-width: 480px; margin: 40px auto; background: white; padding: 28px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        input[type=checkbox] { width: auto; margin: 0 6px 0 0; }
        input:not([type=checkbox]) { width: 100%; padding: 9px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background: #1e3a5f; color: white; padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        .errorlist { color: #c0392b; font-size: 14px; }
        .helptext { font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <nav>
        <strong>Smart Translator</strong>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Translate</a>
                <a href="{% url 'preeti' %}">Preeti Converter</a>
                <a href="{% url 'history' %}">History</a>
                <span style="margin-left:14px;">Hi, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
